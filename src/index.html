<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CorpoMerch Invoice</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="tabview"></div>
  <nav id="nav"></nav>
  <div id="pages"></div>
  <div id="overlay"></div>
  <div id="toasts"></div>
</div>
<script>window.__cmErr=function(m){try{var d=document.getElementById('cmerr');if(!d){d=document.createElement('div');d.id='cmerr';d.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;z-index:99999;background:#fff3f3;color:#a00;font:12px/1.4 monospace;padding:10px 12px;border-top:2px solid #d22329;white-space:pre-wrap';document.body.appendChild(d)}d.textContent+=m+'\n'}catch(e){}};window.addEventListener('error',function(e){__cmErr('Error: '+e.message+' ('+(e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno+')')});window.addEventListener('unhandledrejection',function(e){var r=e.reason;__cmErr('Error: '+(r&&r.stack||r&&r.message||r))})</script>
<script src="app.js"></script>
</body>
</html>
