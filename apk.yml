name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install packages
        run: npm ci

      - name: Build the web app into www/
        run: npm run build

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK with its version
        id: apk
        run: |
          V=$(grep -m1 versionName android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          NAME="CorpoMerch-v${V}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: CorpoMerch-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" "${{ steps.apk.outputs.name }}" \
            --title "CorpoMerch v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Download ${{ steps.apk.outputs.name }} on your Android phone and install it. Sign in with your team email to sync."
